name: "Terraform EKS Deploy"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Manual trigger ke liye button enable karega

permissions:
  id-token: write   # OIDC JWT token generate karne ke liye ZAROORI hai
  contents: read    # Code checkout karne ke liye

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest

    # Agar aapka terraform code kisi subfolder me hai (jaise terraform/), to working-directory set karein:
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Apne role ka exact ARN yahan dalein ya GitHub Secret use karein:
          role-to-assume: arn:aws:iam::132597215176:role/github-actions-role
          aws-region: ap-south-1 # Jahan EKS cluster deploy ho raha hai

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false

      # 'apply' step sirf tab chalega jab 'main' branch me code push/merge hoga
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
